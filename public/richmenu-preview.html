<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 2500px;
    height: 1686px;
    background: #1a4a4a;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 3px;
    padding: 3px;
    font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
  }
  .btn {
    background: #235f5f;
    border-radius: 0px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 56px;
    position: relative;
    overflow: hidden;
  }
  .btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #c8960c, transparent);
  }
  .btn::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #c8960c, transparent);
  }
  .btn svg {
    width: 300px;
    height: 300px;
  }
  .btn span {
    font-family: 'Noto Serif JP', serif;
    font-size: 96px;
    color: #e8c96a;
    font-weight: 400;
    letter-spacing: 0.1em;
    padding-bottom: 80px;
    text-align: center;
    line-height: 1.5;
  }
  .btn span small {
    font-size: 68px;
    color: #c8960c;
    letter-spacing: 0.05em;
    font-weight: 300;
  }
</style>
</head>
<body>

<!-- マイページ（会員証） -->
<div class="btn">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 会員カード -->
    <rect x="14" y="28" width="72" height="48" rx="5" stroke="#c8960c" stroke-width="2"/>
    <line x1="14" y1="44" x2="86" y2="44" stroke="#c8960c" stroke-width="1.2"/>
    <line x1="14" y1="45.5" x2="86" y2="45.5" stroke="#c8960c" stroke-width="0.5" stroke-opacity="0.4"/>
    <!-- 顔シルエット -->
    <circle cx="32" cy="36" r="5" stroke="#c8960c" stroke-width="1.5"/>
    <!-- カード情報ライン -->
    <line x1="26" y1="57" x2="60" y2="57" stroke="#c8960c" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="26" y1="64" x2="48" y2="64" stroke="#c8960c" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 装飾ダイヤ -->
    <rect x="68" y="52" width="10" height="10" rx="1" stroke="#c8960c" stroke-width="1.2" transform="rotate(45 73 57)"/>
  </svg>
  <span>マイページ<br><small>（会員証）</small></span>
</div>

<!-- オススメ商品 -->
<div class="btn">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 瓶シルエット -->
    <path d="M42 22 L42 16 Q42 13 45 13 L55 13 Q58 13 58 16 L58 22" stroke="#c8960c" stroke-width="2" stroke-linecap="round"/>
    <path d="M37 28 Q35 30 35 34 L35 78 Q35 82 39 82 L61 82 Q65 82 65 78 L65 34 Q65 30 63 28 L58 22 L42 22 Z" stroke="#c8960c" stroke-width="2" stroke-linejoin="round"/>
    <!-- ラベル -->
    <rect x="40" y="42" width="20" height="22" rx="1.5" stroke="#c8960c" stroke-width="1.2"/>
    <line x1="43" y1="49" x2="57" y2="49" stroke="#c8960c" stroke-width="1" stroke-linecap="round"/>
    <line x1="43" y1="54" x2="57" y2="54" stroke="#c8960c" stroke-width="1" stroke-linecap="round"/>
    <line x1="43" y1="59" x2="52" y2="59" stroke="#c8960c" stroke-width="1" stroke-linecap="round"/>
    <!-- 草のモチーフ -->
    <path d="M50 35 Q50 30 46 27" stroke="#c8960c" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M50 35 Q50 30 54 27" stroke="#c8960c" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </svg>
  <span>オススメ商品</span>
</div>

<!-- お問い合わせ -->
<div class="btn">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 吹き出し -->
    <path d="M15 20 Q15 15 20 15 L80 15 Q85 15 85 20 L85 62 Q85 67 80 67 L38 67 L25 82 L28 67 L20 67 Q15 67 15 62 Z" stroke="#c8960c" stroke-width="2" stroke-linejoin="round"/>
    <!-- 点線 -->
    <line x1="28" y1="33" x2="72" y2="33" stroke="#c8960c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="28" y1="42" x2="72" y2="42" stroke="#c8960c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="28" y1="51" x2="55" y2="51" stroke="#c8960c" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <span>お問い合わせ</span>
</div>

<!-- ホームページ -->
<div class="btn">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 鳥居モチーフ -->
    <line x1="50" y1="15" x2="50" y2="85" stroke="#c8960c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="50" x2="82" y2="50" stroke="#c8960c" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 外円 -->
    <circle cx="50" cy="50" r="34" stroke="#c8960c" stroke-width="2"/>
    <!-- 内円 -->
    <circle cx="50" cy="50" r="16" stroke="#c8960c" stroke-width="1.2"/>
    <!-- 緯線 -->
    <path d="M16 38 Q50 46 84 38" stroke="#c8960c" stroke-width="1" fill="none" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M16 62 Q50 54 84 62" stroke="#c8960c" stroke-width="1" fill="none" stroke-linecap="round" stroke-opacity="0.7"/>
  </svg>
  <span>ホームページ</span>
</div>

<!-- 公式SNS -->
<div class="btn">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Instagram風フレーム -->
    <rect x="20" y="20" width="60" height="60" rx="14" stroke="#c8960c" stroke-width="2"/>
    <!-- レンズ -->
    <circle cx="50" cy="50" r="16" stroke="#c8960c" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="9" stroke="#c8960c" stroke-width="1.2"/>
    <!-- フラッシュ点 -->
    <circle cx="68" cy="30" r="3.5" stroke="#c8960c" stroke-width="1.5"/>
    <!-- 上部装飾線 -->
    <line x1="28" y1="30" x2="56" y2="30" stroke="#c8960c" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5"/>
  </svg>
  <span>公式SNS</span>
</div>

<!-- 交通アクセス -->
<div class="btn">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- ピン外形（シャープなしずく） -->
    <path d="M50 10 C33 10 22 22 22 36 C22 54 50 88 50 88 C50 88 78 54 78 36 C78 22 67 10 50 10 Z" stroke="#c8960c" stroke-width="2"/>
    <!-- 内円 -->
    <circle cx="50" cy="36" r="11" stroke="#c8960c" stroke-width="1.8"/>
    <!-- 内点 -->
    <circle cx="50" cy="36" r="3.5" fill="#c8960c"/>
    <!-- 地面の楕円 -->
    <ellipse cx="50" cy="90" rx="18" ry="4" stroke="#c8960c" stroke-width="1" stroke-opacity="0.4"/>
  </svg>
  <span>交通アクセス</span>
</div>

</body>
</html>
